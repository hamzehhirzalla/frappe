x-local-logging: &local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:11.8@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62
    logging: *local-logging
  configurator:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
  backend:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: frappe.localhost", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  frontend:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  redis-cache:
    image: redis:8.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    logging: *local-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis-queue:
    image: redis:8.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    logging: *local-logging
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  websocket:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
  queue-short:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
  queue-long:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
  scheduler:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    logging: *local-logging
