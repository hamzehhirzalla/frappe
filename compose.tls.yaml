# Optional HTTPS entrypoint for an existing origin certificate.
services:
  backend:
    environment:
      # Gunicorn is reachable only inside this Compose network. Trust Nginx's
      # HTTPS header so Frappe generates secure cookies and correct URLs.
      FORWARDED_ALLOW_IPS: "*"
  frontend:
    # Replace the HTTP mapping inherited from compose.noproxy.yaml.
    ports: !override
      - ${HTTPS_PUBLISH_PORT:-443}:8443
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/https.conf:ro
      - ${FRAPPE_TLS_CERT_FILE:?Set FRAPPE_TLS_CERT_FILE}:/etc/nginx/certs/fullchain.pem:ro
      - ${FRAPPE_TLS_KEY_FILE:?Set FRAPPE_TLS_KEY_FILE}:/etc/nginx/certs/privkey.pem:ro
