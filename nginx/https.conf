# Keep the upstream-generated Frappe routes on port 8080, including assets and
# Socket.IO. This listener adds TLS and preserves the external HTTPS scheme.
map $http_upgrade $frappe_tls_connection {
    default upgrade;
    '' close;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:frappe_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $frappe_tls_connection;
    }
}
